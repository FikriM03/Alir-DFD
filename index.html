<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Editor DFD (berkas .pam PowerDesigner 6) serta Activity, Use Case, dan BPMN yang bisa diekspor ke Enterprise Architect."><meta name="theme-color" content="#14284a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><style>:root{color-scheme:light}html,body{margin:0;height:100%}[hidden]{display:none!important}</style></head><body><title>Alir DFD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Tata letak meniru jendela PowerDesigner: bilah menu, bilah alat + bilah format, tab diagram, palet alat kiri, kertas kanvas, panel properti kanan.
   Kertas diagram selalu terang (seperti halaman cetak); bingkai aplikasi mengikuti tema. */
:root {
  --bg: #e9ece8;
  --panel: #ffffff;
  --panel2: #f0f2ef;
  --bd: #cfd6ce;
  --fg: #16202a;
  --mut: #5a6875;
  --acc: #1d4ed8;
  --sel: #e03e2d;
  --on: #16202a;
  --on-fg: #f4f6f3;
  --ok: #1f7a46; --warn: #9a6408; --bad: #c0362c;
  --paper: #ffffff; --grid: #eef1f5; --grid2: #dfe5ec;
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --shadow: 0 8px 28px rgba(15, 25, 40, .18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1622; --panel: #141f2e; --panel2: #1a2839; --bd: #2a3b52; --fg: #e4ecf5; --mut: #93a5b9; --acc: #7aa7ff; --sel: #ff7a59;
    --on: #e4ecf5; --on-fg: #0e1622; --ok: #5fd08e; --warn: #e6b04f; --bad: #ff7d70; --shadow: 0 8px 28px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1622; --panel: #141f2e; --panel2: #1a2839; --bd: #2a3b52; --fg: #e4ecf5; --mut: #93a5b9; --acc: #7aa7ff; --sel: #ff7a59;
  --on: #e4ecf5; --on-fg: #0e1622; --ok: #5fd08e; --warn: #e6b04f; --bad: #ff7d70; --shadow: 0 8px 28px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 13.5px/1.45 var(--f-body); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto; }

/* menu */
#menubar { display: flex; align-items: center; gap: 2px; padding: 0 12px; height: 36px; background: var(--panel); border-bottom: 1px solid var(--bd); overflow-x: auto; scrollbar-width: none; }
#menubar::-webkit-scrollbar { display: none; }
.brand { display: flex; align-items: baseline; gap: 5px; margin-right: 12px; flex: none; }
.brand b { font: 700 19px/1 var(--f-display); letter-spacing: -.02em; }
#chkb { flex: none; margin-left: 8px; height: 26px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--bd); border-radius: 13px; background: var(--panel2); font: 600 12px var(--f-body); color: var(--fg); white-space: nowrap; }
#chkb:hover { border-color: var(--acc); }
#chkb i { display: inline-flex; align-items: center; gap: 4px; font-style: normal; }
#chkb i::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
#chkb .b { --c: var(--bad); } #chkb .w { --c: var(--warn); } #chkb .o { --c: var(--ok); }
.help h4 { margin: 4px 0 0; font: 700 13px var(--f-body); }
.help p, .help li { font-size: 13px; line-height: 1.55; margin: 0; }
.help ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.help kbd { font: 600 11px var(--f-mono); padding: 1px 5px; border: 1px solid var(--bd); border-bottom-width: 2px; border-radius: 4px; background: var(--panel2); }
.help table { border-collapse: collapse; width: 100%; font-size: 12.5px; } .help td { padding: 4px 6px; border-bottom: 1px solid var(--bd); vertical-align: top; }
.help .sw3 { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.htabs { display: flex; gap: 4px; flex-wrap: wrap; } .htabs button { border: 1px solid var(--bd); background: var(--panel2); border-radius: 14px; padding: 4px 12px; font: 500 12.5px var(--f-body); color: var(--fg); } .htabs button[aria-selected="true"] { border-color: var(--acc); color: var(--acc); }
.brand span { font: 600 10px/1 var(--f-mono); color: var(--mut); letter-spacing: .08em; }
.mbtn { height: 28px; padding: 0 10px; border: 0; background: none; border-radius: 5px; flex: none; }
.mbtn:hover, .mbtn[aria-expanded="true"] { background: var(--panel2); }
#fname { margin-left: auto; flex: 0 1 200px; min-width: 110px; height: 26px; padding: 0 8px; background: var(--panel2); border: 1px solid var(--bd); border-radius: 5px; font-weight: 500; }

.menu { position: fixed; z-index: 40; min-width: 230px; padding: 5px; background: var(--panel); border: 1px solid var(--bd); border-radius: 8px; box-shadow: var(--shadow); max-height: calc(100vh - 60px); overflow-y: auto; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 6px 10px; border: 0; background: none; border-radius: 5px; text-align: left; white-space: nowrap; }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--panel2); outline: none; }
.menu button:disabled { opacity: .4; cursor: default; }
.menu button .k { margin-left: auto; padding-left: 18px; font: 500 11px var(--f-mono); color: var(--mut); }
.menu button .ck { width: 14px; text-align: center; color: var(--acc); flex: none; }
.menu hr { border: 0; border-top: 1px solid var(--bd); margin: 5px 4px; }
.menu .hd { padding: 6px 10px 2px; font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }

/* bilah alat & format */
#toolbar { display: flex; align-items: center; gap: 6px; padding: 5px 12px; background: var(--panel); border-bottom: 1px solid var(--bd); overflow-x: auto; scrollbar-width: thin; }
.tg { display: flex; align-items: center; gap: 2px; flex: none; }
.vsep { width: 1px; height: 22px; background: var(--bd); flex: none; margin: 0 3px; }
.tb { height: 30px; min-width: 30px; padding: 0 7px; border: 1px solid transparent; background: none; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
.tb:hover:not(:disabled) { background: var(--panel2); border-color: var(--bd); }
.tb:disabled { opacity: .35; cursor: default; }
.tb[aria-pressed="true"] { background: var(--on); color: var(--on-fg); }
.tb.pri { background: var(--on); color: var(--on-fg); font-weight: 500; padding: 0 11px; }
.tb.pri:hover { background: var(--on); opacity: .88; }
.tb .sw { width: 16px; height: 5px; border-radius: 1px; border: 1px solid rgba(0,0,0,.25); position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); }
.tb.col { position: relative; padding-bottom: 4px; }
.fsel { height: 30px; padding: 0 4px; border: 1px solid var(--bd); border-radius: 5px; background: var(--panel); max-width: 150px; }
.fsel:disabled { opacity: .35; }
.tlabel { font: 600 10.5px var(--f-mono); letter-spacing: .06em; color: var(--mut); text-transform: uppercase; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* tab diagram */
#tabs { display: flex; align-items: flex-end; gap: 2px; padding: 5px 12px 0; background: var(--panel2); border-bottom: 1px solid var(--bd); overflow-x: auto; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 11px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; color: var(--mut); white-space: nowrap; flex: none; cursor: pointer; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { background: var(--bg); border-color: var(--bd); color: var(--fg); font-weight: 500; margin-bottom: -1px; height: 31px; }
.tab .lv { font: 600 10px var(--f-mono); color: var(--mut); }
.tab .x { border: 0; background: none; padding: 0 3px; color: var(--mut); font-size: 15px; line-height: 1; border-radius: 3px; }
.tab .x:hover { color: var(--bad); }
.tab.add { color: var(--mut); border: 0; background: none; }

/* area kerja */
#main { display: grid; grid-template-columns: 62px minmax(0, 1fr) 290px; min-height: 0; }
#rail { display: flex; flex-direction: column; gap: 3px; padding: 8px 7px; background: var(--panel); border-right: 1px solid var(--bd); overflow-y: auto; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px; border: 0; background: none; border-radius: 6px; font-size: 10.5px; color: var(--mut); }
.tool:hover { background: var(--panel2); color: var(--fg); }
.tool[aria-pressed="true"] { background: var(--on); color: var(--on-fg); }
.tool svg { width: 24px; height: 24px; }
.tool kbd { font: 500 9px var(--f-mono); opacity: .6; }

#stage { position: relative; overflow: hidden; background-color: var(--paper); touch-action: none; }
#stage.grid { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px), linear-gradient(var(--grid2) 1px, transparent 1px), linear-gradient(90deg, var(--grid2) 1px, transparent 1px); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; user-select: none; -webkit-user-select: none; color-scheme: light; }
#inl { position: absolute; transform: translate(-50%, -50%); z-index: 3; height: 28px; padding: 0 8px; text-align: center; background: #fff; color: #111; border: 2px solid var(--sel); border-radius: 4px; font: 500 13px var(--f-body); box-shadow: 0 4px 14px rgba(0,0,0,.2); color-scheme: light; }
#zoombar { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 1px; padding: 3px; background: var(--panel); border: 1px solid var(--bd); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
#zoombar .tb { border: 0; height: 28px; }
#zoomv { min-width: 52px; font: 500 12px var(--f-mono); }
#crumbs { position: absolute; left: 12px; top: 10px; display: flex; gap: 4px; align-items: center; padding: 4px 6px; background: var(--panel); border: 1px solid var(--bd); border-radius: 7px; font-size: 12.5px; box-shadow: 0 2px 8px rgba(0,0,0,.08); max-width: calc(100% - 24px); overflow-x: auto; }
#crumbs button { border: 0; background: none; padding: 2px 6px; border-radius: 4px; color: var(--acc); white-space: nowrap; }
#crumbs button:hover { background: var(--panel2); }
#crumbs span.cur { padding: 2px 6px; font-weight: 500; white-space: nowrap; }
#crumbs i { color: var(--mut); font-style: normal; }
#toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 8px 14px; background: var(--on); color: var(--on-fg); border-radius: 8px; font-size: 13px; z-index: 5; pointer-events: none; }
#drop { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(255,255,255,.85); color: #16202a; border: 3px dashed var(--sel); font: 700 20px var(--f-display); pointer-events: none; }

/* SVG */
.hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; }
@media (pointer: coarse) { .hit { stroke-width: 24; } }
.selbox { fill: none; stroke: #e03e2d; }
.handle { fill: #fff; stroke: #e03e2d; }
.mid { fill: #e03e2d; opacity: .35; } .mid:hover { opacity: .9; }
.marq { fill: rgba(224, 62, 45, .08); stroke: #e03e2d; }
#mpbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 8px; white-space: nowrap; justify-content: center; max-width: calc(100% - 24px); padding: 6px 8px 6px 14px; background: #fff; border: 1.5px solid #1a73e8; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.14); font-size: 13px; color: #1d2733; }
#mpbar .btn { padding: 4px 10px; font-size: 12.5px; }
#mpbar .btn.pri { background: #1a73e8; border-color: #1a73e8; color: #fff; }
#findbar { position: absolute; top: 10px; right: 12px; z-index: 7; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: min(380px, calc(100% - 24px)); padding: 8px; background: #fff; border: 1px solid #c9d1db; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.14); font-size: 13px; }
#findbar #findq { flex: 1 1 160px; min-width: 0; }
#findbar #findn { color: #5b6573; font-size: 12px; white-space: nowrap; }
#findbar .btn { padding: 4px 8px; }
#findl { flex-basis: 100%; display: flex; flex-direction: column; max-height: 260px; overflow: auto; }
#findl:empty { display: none; }
#findl .fi { display: flex; justify-content: space-between; gap: 10px; text-align: left; padding: 6px 8px; border: 0; background: none; border-radius: 6px; cursor: pointer; font: inherit; color: inherit; }
#findl .fi:hover, #findl .fi:focus-visible { background: #eef3fb; }
#findl .fi span { color: #6b7684; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
#findl .fmore { color: #6b7684; font-size: 12px; padding: 4px 8px; }
.grpbox { fill: none; stroke: #7b5cd6; pointer-events: none; }
.labsel { fill: none; stroke: #000; pointer-events: none; }
.flab, .elab { cursor: move; }
.lockb { pointer-events: none; }
#app.ea .fl .hit { cursor: move; }
.handle.lnc { fill: #fff; stroke: #000; }
.guide { fill: none; stroke: #1a73e8; pointer-events: none; }
.pv { stroke: #e03e2d; fill: none; }
.endh { fill: #1a73e8; stroke: #fff; }
.seg { fill: #fff; stroke: #1a73e8; } .seg:hover { fill: #1a73e8; }
.qc circle { fill: #fff; stroke: #1a73e8; stroke-width: 1.3; opacity: .92; } .qc path { fill: none; stroke: #1a73e8; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.qc:hover circle { fill: #1a73e8; } .qc:hover path { stroke: #fff; }
.target { fill: rgba(26, 115, 232, .08); stroke: #1a73e8; }
.el, .fl { cursor: pointer; }
.dec { cursor: zoom-in; }

/* panel */
#panel { background: var(--panel); border-left: 1px solid var(--bd); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }
#panel h2, .modal h3 { margin: 0; font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
.sec { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label, .flabel { font-size: 12px; color: var(--mut); }
.in { height: 32px; width: 100%; padding: 0 9px; background: var(--panel2); border: 1px solid var(--bd); border-radius: 5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { height: 32px; padding: 0 12px; border: 1px solid var(--bd); background: var(--panel); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--panel2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.pri { background: var(--on); color: var(--on-fg); border-color: var(--on); font-weight: 500; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.row .btn { flex: 1 1 auto; }
.kv { display: flex; justify-content: space-between; gap: 8px; }
.kv b { font: 500 12.5px var(--f-mono); }
.hint { font-size: 12.5px; color: var(--mut); margin: 0; }
.chk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.chk li { display: grid; grid-template-columns: 7px minmax(0, 1fr); gap: 9px; padding: 5px 4px 5px 0; font-size: 12.5px; line-height: 1.4; border-radius: 4px; }
.chk li::before { content: ""; border-radius: 2px; background: var(--c); }
.chk li.bad { --c: var(--bad); } .chk li.warn { --c: var(--warn); } .chk li.ok { --c: var(--ok); }
.chk li[data-go] { cursor: pointer; } .chk li[data-go]:hover { background: var(--panel2); }
.chk li small { display: block; color: var(--mut); font-size: 11.5px; }
.flowlist { display: flex; flex-direction: column; gap: 1px; }
.flowlist button { text-align: left; background: none; border: 0; padding: 4px 6px; border-radius: 4px; font-size: 12.5px; }
.flowlist button:hover { background: var(--panel2); }
.flowlist i { font-style: normal; font-family: var(--f-mono); color: var(--mut); }
.tree { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.tree ul { list-style: none; margin: 0; padding-left: 16px; border-left: 1px solid var(--bd); margin-left: 7px; }
.tree button { border: 0; background: none; padding: 3px 6px; border-radius: 4px; text-align: left; width: 100%; }
.tree button:hover { background: var(--panel2); }
.tree button.cur { background: var(--on); color: var(--on-fg); }
.tree .n { font: 600 11.5px var(--f-mono); margin-right: 6px; }
.cbx { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.cbx input { width: 16px; height: 16px; margin: 0; accent-color: var(--acc); }

#status { display: flex; justify-content: space-between; gap: 16px; padding: 5px 12px; font-size: 12px; color: var(--mut); background: var(--panel); border-top: 1px solid var(--bd); }
#status span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#method { font-family: var(--f-mono); font-size: 11.5px; }

/* popover warna */
.pop { position: fixed; z-index: 45; padding: 10px; background: var(--panel); border: 1px solid var(--bd); border-radius: 8px; box-shadow: var(--shadow); width: 236px; display: flex; flex-direction: column; gap: 8px; }
.pal { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.pal button { aspect-ratio: 1; border: 1px solid rgba(0,0,0,.2); border-radius: 3px; padding: 0; }
.pal button:hover { transform: scale(1.12); }
.pal button.cur { outline: 2px solid var(--acc); outline-offset: 1px; }
.pop .row .btn { height: 28px; font-size: 12.5px; }
.pop input[type=color] { width: 100%; height: 30px; border: 1px solid var(--bd); border-radius: 5px; background: none; padding: 2px; }


/* ---------- mode UML (gaya EA) ---------- */
#app.ea #main { grid-template-columns: 196px minmax(0, 1fr) 300px; }
#app.ea #rail { padding: 6px; gap: 2px; }
.tbx-top { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-bottom: 4px; }
.tool.w { flex-direction: row; justify-content: flex-start; gap: 8px; padding: 5px 8px; font-size: 12.5px; text-align: left; color: var(--fg); }
.tool.w svg { width: 18px; height: 18px; } .tool.w[aria-pressed="true"] { color: var(--on-fg); } .tool.w kbd { margin-left: auto; }
.tool.w span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbx-g { display: flex; flex-direction: column; }
.tbx-h { display: flex; align-items: center; gap: 6px; border: 0; background: var(--panel2); border-radius: 5px; padding: 5px 8px; margin-top: 6px; font: 600 11px var(--f-body); color: var(--mut); text-align: left; }
.tbx-h::before { content: "▾"; font-size: 10px; } .tbx-h[aria-expanded="false"]::before { content: "▸"; }
.tbx-items { display: flex; flex-direction: column; gap: 1px; padding-top: 3px; }
.kb { display: inline-grid; place-items: center; min-width: 22px; height: 16px; padding: 0 3px; margin-right: 6px; border-radius: 3px; font: 700 9.5px var(--f-mono); color: #fff; background: #5a6875; flex: none; }
.kb-activity { background: #b45309; } .kb-usecase { background: #2563eb; } .kb-bpmn { background: #0f766e; }
.tab .kb { margin-right: 0; }
.pbsec { gap: 5px; }
.pbhead { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.row.tight { gap: 4px; flex-wrap: nowrap; } .btn.sm { height: 26px; padding: 0 8px; font-size: 12px; }
.pbbox { max-height: 34vh; overflow: auto; border: 1px solid var(--bd); border-radius: 6px; padding: 4px; background: var(--panel); }
.tree.pb { font-size: 12.5px; } .tree.pb button { display: flex; align-items: center; gap: 4px; padding: 2px 5px; white-space: nowrap; }
.tree.pb button i { margin-left: auto; font: 500 10.5px var(--f-mono); color: var(--mut); font-style: normal; }
.tree.pb button.sel { background: var(--panel2); outline: 1px solid var(--acc); }
.tree.pb svg.s { width: 14px; height: 14px; stroke-width: 1.6; color: var(--mut); }
.pbrow { display: flex; align-items: center; gap: 6px; padding: 2px 4px; }
.pkgi { width: 14px; height: 11px; border: 1.5px solid #b7791f; border-radius: 2px; position: relative; background: #fde68a; }
.in.ta { height: auto; padding: 6px 9px; resize: vertical; font: inherit; line-height: 1.4; }

/* PDF sederhana: satu halaman A4 mendatar per diagram, gambar JPEG + judul */

function buildPDF(pages, title) {

  function add(b) { chunks.push(b); off += b.length; }

  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Count ' + pages.length + ' /Kids [' + pages.map(function (_, i) { return (4 + i * 3) + ' 0 R'; }).join(' ') + '] >>');
  obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');

      'BT /F1 13 Tf ' + M + ' ' + (PH - M - 8) + ' Td (' + pdfStr(pg.title) + ') Tj ET\n' +
      'BT /F1 8 Tf ' + M + ' ' + (M - 12) + ' Td (' + pdfStr(title + '  -  halaman ' + (i + 1) + ' dari ' + pages.length) + ') Tj ET\n';
    obj(po, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /Font << /F1 3 0 R >> /XObject << /Im' + i + ' ' + io + ' 0 R >> >> /Contents ' + co + ' 0 R >>');

async function doPDF() {

}
